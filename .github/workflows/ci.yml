name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Playwright browsers are binary artifacts, not pnpm dependencies.
      # Fresh GitHub runners never have the pinned Chromium build preinstalled.
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright browser and WCAG tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Run local CI contract
        run: sh scripts/ci.sh
      # Upload only synthetic task-navigation evidence, never the full
      # test-results tree (which may contain local-demo JWTs or API payloads).
      - name: Preserve synthetic Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: folio-synthetic-task-navigation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/task-navigation-*/task-anchor-diagnostics.json
            test-results/task-navigation-*/trace.zip
            test-results/task-navigation-*/test-failed-*.png
          if-no-files-found: ignore
          retention-days: 3
