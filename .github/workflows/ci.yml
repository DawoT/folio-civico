name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Playwright browsers are binary artifacts, not pnpm dependencies.
      # Fresh GitHub runners never have the pinned Chromium build preinstalled.
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright browser and WCAG tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Run local CI contract
        run: sh scripts/ci.sh
