name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Not required for local development. When Actions is available again,
      # it must run the exact same gates as sh scripts/ci.sh.
      - name: Run local CI contract
        run: sh scripts/ci.sh
